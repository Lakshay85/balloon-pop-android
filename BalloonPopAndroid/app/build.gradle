plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.midnighttales.balloonpop'
    compileSdk 36

    defaultConfig {
        applicationId 'com.midnighttales.balloonpop'
        minSdk 24
        targetSdk 36
        // IMPORTANT: versionCode must be higher than the current release in
        // Play Console (v1.0 was almost certainly versionCode 1). Check
        // Play Console > Release > App bundle explorer and bump if needed.
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Google demo AdMob IDs. Debug builds can never touch real ad inventory.
            manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'ADMOB_AD_UNIT_ID', '"ca-app-pub-3940256099942544/5354046379"'
        }
        release {
            // Real Midnight Tales AdMob IDs, only compiled into release builds.
            manifestPlaceholders = [admobAppId: 'ca-app-pub-2408586648009670~8542262938']
            buildConfigField 'String', 'ADMOB_AD_UNIT_ID', '"ca-app-pub-2408586648009670/6284920201"'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
